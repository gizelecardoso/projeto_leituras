name: Projeto Leitura

on:
  pull_request:
    branches:
      - main
  
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Rails Docker image
        run: docker compose build --no-cache web
