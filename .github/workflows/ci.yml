name: Projeto Leitura

on:
  pull_request:
    branches:
      - main
  
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_USER: ${{ vars.DATABASE_USER }}
      DATABASE_NAME: ${{ vars.DATABASE_NAME }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Rails Docker image
        run: docker compose build --no-cache web
      
      - name: Check database configuration
        run: |
          docker compose run --rm --no-deps web sh -c '
            echo "DATABASE_USER=$DATABASE_USER"
            echo "DATABASE_HOST=$DATABASE_HOST"
            echo "DATABASE_NAME=$DATABASE_NAME"
          '

      - name: Prepare test database
        run: docker compose run --rm -e RAILS_ENV=test web bundle exec rails db:prepare

      - name: Run RSpec tests
        run: docker compose run --rm -e RAILS_ENV=test web bundle exec rspec
